<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Earn Zone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">⚡ Earn Zone</div>
    <div class="balance-card">
        <div>YOUR BALANCE</div>
        <div class="balance-amount">৳<span id="userBalance">0.00</span></div>
    </div>

    <div class="section-title">Official Tasks</div>
    <div class="task-list">
        <div class="task-item" id="groupTask">
            <span>📢 সাপোর্ট গ্রুপে জয়েন করুন</span>
            <button class="task-btn" onclick="completeTask('group', 10)">টাস্ক</button>
        </div>
        <div class="task-item" id="channelTask">
            <span>💬 পেমেন্ট চ্যানেল জয়েন করুন</span>
            <button class="task-btn" onclick="completeTask('channel', 10)">টাস্ক</button>
        </div>
    </div>

    <div class="footer-nav">
        <div class="nav-item">🏠<br>HOME</div>
        <div class="nav-item">👥<br>REFER</div>
        <div class="nav-item">💸<br>WITHDRAW</div>
        <div class="nav-item">👤<br>PROFILE</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
