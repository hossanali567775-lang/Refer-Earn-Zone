<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Zone</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #060213;
            color: #ffffff;
            padding: 20px;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* Top Header Area */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 5px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #b832df, #f231a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        /* Exact Glowing Balance Card */
        .balance-card {
            background: linear-gradient(180deg, rgba(28, 20, 56, 0.8), rgba(15, 10, 32, 0.9));
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(168, 85, 247, 0.1);
        }

        /* Glowing blur effect behind card */
        .balance-card::before {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
            z-index: -1;
            border-radius: 30px;
        }

        .balance-title {
            color: #94a3b8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .balance-amount {
            font-size: 46px;
            font-weight: 800;
            color: #facc15;
            margin: 12px 0;
            text-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
            letter-spacing: -1px;
        }

        .balance-sub {
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
        }

        /* Glowing Section Label */
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, #d946ef, #a855f7);
            border-radius: 4px;
            box-shadow: 0 0 10px #d946ef;
        }

        /* Beautiful Task Cards */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .task-item {
            background: rgba(22, 17, 45, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .task-icon {
            font-size: 22px;
            background: rgba(30, 23, 61, 0.9);
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(168, 85, 247, 0.1);
        }

        .task-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .task-reward {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        /* Premium Purple Glowing Buttons */
        .task-btn {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
            transition: all 0.3s ease;
        }

        .task-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.2);
        }

        /* Fixed Bottom Navigation Menu */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(13, 9, 31, 0.95);
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            display: flex;
            justify-content: space-around;
            padding: 14px 0 18px 0;
            z-index: 1000;
            backdrop-filter: blur(20px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item.active {
            color: #c084fc;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.4);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ Earn Zone</div>
        <div class="avatar">U</div>
    </div>

    <div class="balance-card">
        <div class="balance-title">YOUR BALANCE</div>
        <div class="balance-amount">৳<span id="userBalance">0.00</span></div>
        <div class="balance-sub">Available to withdraw</div>
    </div>

    <div class="section-title">ডেইলি টাস্ক</div>
    <div class="task-list">
        <div class="task-item">
            <div class="task-info">
                <div class="task-icon">📢</div>
                <div>
                    <div class="task-name">সাপোর্ট গ্রুপে জয়েন করুন</div>
                    <div class="task-reward"><span id="groupStatus">টাস্কটি অসম্পূর্ণ</span></div>
                </div>
            </div>
            <button class="task-btn" onclick="completeTask('group', 10)">টাস্ক</button>
        </div>

        <div class="task-item">
            <div class="task-info">
                <div class="task-icon">💬</div>
                <div>
                    <div class="task-name">পেমেন্ট চ্যানেল জয়েন করুন</div>
                    <div class="task-reward"><span id="channelStatus">টাস্কটি অসম্পূর্ণ</span></div>
                </div>
            </div>
            <button class="task-btn" onclick="completeTask('channel', 10)">টাস্ক</button>
        </div>

        <div class="task-item">
            <div class="task-info">
                <div class="task-icon">📺</div>
                <div>
                    <div class="task-name">অফার ১ (Ads)</div>
                    <div class="task-reward" style="color:#c084fc;">+৳১০</div>
                </div>
            </div>
            <button class="task-btn" onclick="watchAd(10, 'Offer 1')">টাস্ক</button>
        </div>

        <div class="task-item">
            <div class="task-info">
                <div class="task-icon">🎬</div>
                <div>
                    <div class="task-name">অফার ২ (Ads)</div>
                    <div class="task-reward" style="color:#c084fc;">+৳১০</div>
                </div>
            </div>
            <button class="task-btn" onclick="watchAd(10, 'Offer 2')">টাস্ক</button>
        </div>

        <div class="task-item">
            <div class="task-info">
                <div class="task-icon">🔥</div>
                <div>
                    <div class="task-name">অফার ৩ (Ads)</div>
                    <div class="task-reward" style="color:#c084fc;">+৳১০</div>
                </div>
            </div>
            <button class="task-btn" onclick="watchAd(10, 'Offer 3')">টাস্ক</button>
        </div>
    </div>

    <div class="footer-nav">
        <a class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <div>HOME</div>
        </a>
        <a class="nav-item" onclick="alert('আপনার রেফারেল লিংক কপি হয়েছে!')">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 1.34 5 3s1.34 3 8 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <div>REFER</div>
        </a>
        <a class="nav-item" onclick="triggerWithdraw()">
            <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            <div>WITHDRAW</div>
        </a>
    </div>

    <script>
        const monetagLink = "https://your-monetag-direct-link.com"; 
        const groupLink = "https://t.me/your_support_group";       
        const channelLink = "https://t.me/your_payment_channel";   

        let userBalance = parseFloat(localStorage.getItem('balance')) || 0.00;
        let isGroupJoined = localStorage.getItem('isGroupJoined') === 'true';
        let isChannelJoined = localStorage.getItem('isChannelJoined') === 'true';

        function updateUI() {
            document.getElementById('userBalance').innerText = userBalance.toFixed(2);
            if(isGroupJoined) {
                document.getElementById('groupStatus').innerHTML = "Completed (<span style='color:#c084fc;'>৳১০ Claimed</span>)";
            }
            if(isChannelJoined) {
                document.getElementById('channelStatus').innerHTML = "Completed (<span style='color:#c084fc;'>৳১০ Claimed</span>)";
            }
        }

        function watchAd(reward, offerName) {
            alert(offerName + " লোড হচ্ছে... সম্পূর্ণ দেখে ব্যাক করুন।");
            window.open(monetagLink, "_blank");
            
            setTimeout(() => {
                userBalance += reward;
                localStorage.setItem('balance', userBalance);
                updateUI();
                alert("সফল! " + offerName + " এর জন্য ব্যালেন্সে ৳" + reward + " যোগ করা হয়েছে।");
            }, 1000);
        }

        function completeTask(type, reward) {
            if (type === 'group') {
                if (isGroupJoined) { alert("আপনি এই টাস্কটি অলরেডি করেছেন!"); return; }
                window.open(groupLink, "_blank");
                isGroupJoined = true;
                localStorage.setItem('isGroupJoined', 'true');
            } else if (type === 'channel') {
                if (isChannelJoined) { alert("আপনি এই টাস্কটি অলরেডি করেছেন!"); return; }
                window.open(channelLink, "_blank");
                isChannelJoined = true;
                localStorage.setItem('isChannelJoined', 'true');
            }
            
            userBalance += reward;
            localStorage.setItem('balance', userBalance);
            updateUI();
        }

        function triggerWithdraw() {
            if(userBalance < 50) {
                alert("দুঃখিত! টাকা তোলার জন্য ন্যূনতম ৫০ টাকা ব্যালেন্স প্রয়োজন। আপনার বর্তমান ব্যালেন্স: ৳" + userBalance.toFixed(2));
            } else {
                alert("টাকা তোলার রিকোয়েস্ট এডমিনের কাছে পাঠানো হয়েছে।");
            }
        }

        updateUI();
    </script>
</body>
</html>
