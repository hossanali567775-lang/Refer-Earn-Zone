<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Zone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0914; color: #ffffff; padding: 20px; padding-bottom: 90px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { font-size: 26px; font-weight: bold; color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        .avatar { width: 45px; height: 45px; background: #ffcc00; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        /* Balance Card */
        .balance-card { background: linear-gradient(135deg, #1c1a2e, #0b0914); border: 2px solid #ffcc00; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 30px; box-shadow: 0 0 20px rgba(255, 204, 0, 0.2); }
        .balance-amount { font-size: 40px; font-weight: 800; color: #ffcc00; }
        .balance-sub { color: #aaa; font-size: 14px; margin-top: 5px; }
        
        /* Section */
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #ffcc00; }
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-item { background: #1a172a; border: 1px solid #333; border-radius: 15px; padding: 18px; display: flex; align-items: center; justify-content: space-between; }
        
        /* Buttons */
        .task-btn { background: #ffcc00; color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .footer-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a172a; border-top: 2px solid #ffcc00; display: flex; justify-content: space-around; padding: 15px 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #ffcc00; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Earn Zone</div>
        <div class="avatar">U</div>
    </div>

    <div class="balance-card">
        <div class="balance-amount">৳<span id="userBalance">0.00</span></div>
        <div class="balance-sub">আপনার বর্তমান ব্যালেন্স</div>
    </div>

    <div class="section-title">ডেইলি টাস্ক</div>
    <div class="task-list">
        <div class="task-item">
            <div>সাপোর্ট গ্রুপে জয়েন করুন</div>
            <button class="task-btn" onclick="completeTask('group', 10)">টাস্ক</button>
        </div>
        <div class="task-item">
            <div>পেমেন্ট চ্যানেল জয়েন করুন</div>
            <button class="task-btn" onclick="completeTask('channel', 10)">টাস্ক</button>
        </div>
        <div class="task-item">
            <div>অফার ১ (Ads)</div>
            <button class="task-btn" onclick="watchAd(10)">টাস্ক</button>
        </div>
    </div>

    <div class="footer-nav">
        <div class="nav-item">🏠 HOME</div>
        <div class="nav-item" onclick="alert('রেফার লিংক কপি হয়েছে!')">👥 REFER</div>
        <div class="nav-item" onclick="alert('ন্যূনতম ৫০ টাকা প্রয়োজন')">💰 WITHDRAW</div>
    </div>

    <script>
        const monetagLink = "আপনার_মোনেটাগ_লিংক";
        const groupLink = "আপনার_গ্রুপ_লিংক";
        const channelLink = "আপনার_চ্যানেল_লিংক";

        let userBalance = parseFloat(localStorage.getItem('balance')) || 0.00;
        
        function updateUI() { document.getElementById('userBalance').innerText = userBalance.toFixed(2); }

        function watchAd(reward) {
            window.open(monetagLink, "_blank");
            userBalance += reward;
            localStorage.setItem('balance', userBalance);
            updateUI();
        }

        function completeTask(type, reward) {
            if(type === 'group') { window.open(groupLink, "_blank"); }
            else if(type === 'channel') { window.open(channelLink, "_blank"); }
            userBalance += reward;
            localStorage.setItem('balance', userBalance);
            updateUI();
        }
        updateUI();
    </script>
</body>
</html>
